<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Panel — AI Anime RP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15121c;
    --paper:#f6efe2;
    --pink:#ff3d6e;
    --violet:#4b3a70;
    --gold:#f2c14e;
    --line:#15121c;
    color-scheme: light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--ink);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overscroll-behavior:none;
  }
  .app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column; border-left:3px solid var(--line); border-right:3px solid var(--line);}
  .halftone{
    background-image: radial-gradient(var(--ink) 1.2px, transparent 1.2px);
    background-size: 9px 9px;
    background-color: var(--gold);
  }
  header.top{
    padding:16px 18px 14px; border-bottom:3px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{font-family:'Kalam',cursive; font-weight:700; font-size:1.5rem; letter-spacing:.5px;}
  .iconbtn{
    border:2px solid var(--line); background:#fff; border-radius:10px;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; cursor:pointer;
  }
  .iconbtn:active{transform:translateY(1px);}
  .screen{flex:1; display:none; flex-direction:column; min-height:0;}
  .screen.active{display:flex;}

  /* Setup screen */
  .setup{padding:22px 20px; gap:14px; display:flex; flex-direction:column;}
  .setup h1{font-family:'Kalam',cursive; font-size:1.6rem; margin:0 0 2px;}
  .setup p{margin:0; line-height:1.5; color:#3a3540;}
  .field label{display:block; font-weight:800; font-size:.85rem; margin-bottom:6px;}
  input[type=text], input[type=password], textarea, select{
    width:100%; border:2px solid var(--line); border-radius:10px; padding:11px 12px;
    font-family:inherit; font-size:1rem; background:#fff;
  }
  textarea{resize:vertical; min-height:70px;}
  .btn{
    border:2px solid var(--line); border-radius:12px; padding:12px 16px;
    font-family:'Nunito'; font-weight:800; font-size:1rem; cursor:pointer;
    background:var(--pink); color:#fff; box-shadow:3px 3px 0 var(--line);
  }
  .btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line);}
  .btn.secondary{background:#fff; color:var(--ink);}
  .btn.ghost{background:transparent; box-shadow:none; border:none; text-decoration:underline; padding:4px;}
  .hint{font-size:.8rem; color:#6b6473;}

  /* Character list */
  .list{padding:16px; gap:12px; display:flex; flex-direction:column; overflow-y:auto;}
  .card{
    border:2.5px solid var(--line); border-radius:14px; background:#fff;
    padding:14px; display:flex; gap:12px; align-items:center; cursor:pointer;
    box-shadow:3px 3px 0 var(--line);
  }
  .card:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line);}
  .avatar{
    width:52px; height:52px; border-radius:50%; border:2.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0;
    font-family:'Kalam',cursive; font-weight:700; color:#fff;
  }
  .card .meta{min-width:0;}
  .card .name{font-family:'Kalam',cursive; font-weight:700; font-size:1.15rem;}
  .card .sub{font-size:.82rem; color:#6b6473; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .newcard{
    border:2.5px dashed var(--line); border-radius:14px; padding:16px;
    text-align:center; font-weight:800; color:var(--violet); cursor:pointer; background:transparent;
  }
  .empty{padding:40px 20px; text-align:center; color:#6b6473;}
  .empty .big{font-size:2.5rem; margin-bottom:8px;}

  /* Create character screen */
  .create{padding:18px 20px; gap:12px; display:flex; flex-direction:column; overflow-y:auto;}
  .swatches{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:32px; height:32px; border-radius:50%; border:2px solid var(--line); cursor:pointer;}
  .swatch.sel{outline:3px solid var(--pink); outline-offset:2px;}

  /* Chat screen */
  .chatbar{
    padding:12px 14px; border-bottom:3px solid var(--line); display:flex; align-items:center; gap:10px;
  }
  .chatbar .name{font-family:'Kalam',cursive; font-weight:700; font-size:1.1rem; flex:1;}
  .messages{flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:12px;}
  .msg{max-width:82%; padding:10px 14px; line-height:1.45; font-size:.97rem; position:relative;}
  .msg.ai{
    align-self:flex-start; background:#fff; border:2.5px solid var(--line);
    border-radius:4px 16px 16px 16px; box-shadow:2px 2px 0 var(--line);
  }
  .msg.user{
    align-self:flex-end; background:var(--pink); color:#fff; border:2.5px solid var(--line);
    border-radius:16px 4px 16px 16px; box-shadow:2px 2px 0 var(--line);
  }
  .msg .who{font-family:'Kalam',cursive; font-weight:700; font-size:.78rem; margin-bottom:3px; opacity:.75;}
  .msg .delx{
    position:absolute; top:-9px; background:#fff; border:2px solid var(--line); border-radius:50%;
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    font-size:.75rem; cursor:pointer; padding:0; line-height:1;
  }
  .msg.ai .delx{ right:-8px; }
  .msg.user .delx{ left:-8px; background:#fff; }
  .msg .delx:active{ transform:scale(0.9); }
  .typing{align-self:flex-start; font-size:.85rem; color:#6b6473; font-style:italic; padding-left:4px;}
  .inputbar{
    display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
    border-top:3px solid var(--line); background:var(--paper);
  }
  .inputbar textarea{flex:1; min-height:42px; max-height:120px; border-radius:16px;}
  .sendbtn{
    width:46px; height:46px; border-radius:50%; border:2.5px solid var(--line);
    background:var(--pink); color:#fff; font-size:1.2rem; cursor:pointer; flex-shrink:0;
    box-shadow:2px 2px 0 var(--line);
  }
  .sendbtn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--line);}
  .cast{display:flex; gap:6px; overflow-x:auto; padding:8px 12px; border-top:2px solid var(--line); background:var(--paper);}
  .cast:empty{display:none;}
  .chip{flex-shrink:0; border:2px solid var(--line); background:#fff; border-radius:999px; padding:4px 11px; font-weight:800; font-size:.8rem; cursor:pointer; font-family:inherit;}
  .chip:active{background:var(--gold);}
  .msg b{font-weight:800;}
  .err{background:#fff0f0; border:2px solid var(--pink); border-radius:10px; padding:10px 12px; font-size:.85rem; color:#a10033;}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:#c9c2d6; border-radius:3px;}
</style>
</head>
<body>
<div class="app">

  <!-- SETUP SCREEN -->
  <div id="screen-setup" class="screen">
    <header class="top halftone"><div class="brand">📖 Panel</div><div></div></header>
    <div class="setup">
      <h1>Kendi AI anime chat'in</h1>
      <p>Tamamen ücretsiz çalışması için bir Gemini API key'ine ihtiyaç var. Key'in sadece bu telefonda, bu tarayıcıda saklanır — hiçbir yere gönderilmez.</p>
      <div class="field">
        <label>Gemini API Key</label>
        <input type="password" id="apiKeyInput" placeholder="AIza... ile başlar" autocomplete="off">
      </div>
      <div class="field">
        <label>Model</label>
        <select id="modelSelect">
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (önerilen, günlük 500 ücretsiz istek)</option>
          <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (günlük 500 ücretsiz istek)</option>
          <option value="gemini-3.5-flash">gemini-3.5-flash (daha güçlü, günlük 20 ücretsiz istek)</option>
        </select>
      </div>
      <button class="btn" id="saveKeyBtn">Kaydet ve başla</button>
      <p class="hint">Key'i aistudio.google.com üzerinden "Get API key" diyerek ücretsiz alabilirsin.</p>
      <div id="setupErr"></div>
    </div>
  </div>

  <!-- CHARACTER LIST SCREEN -->
  <div id="screen-list" class="screen">
    <header class="top halftone">
      <div class="brand">📖 Panel</div>
      <button class="iconbtn" id="settingsBtn" title="Ayarlar">⚙️</button>
    </header>
    <div class="list" id="charList"></div>
  </div>

  <!-- CREATE CHARACTER SCREEN -->
  <div id="screen-create" class="screen">
    <header class="top">
      <button class="iconbtn" id="createBackBtn">←</button>
      <div class="brand">Yeni karakter</div>
      <div style="width:38px"></div>
    </header>
    <div class="create">
      <div class="field">
        <label>İsim</label>
        <input type="text" id="charName" placeholder="örn. Aiko">
      </div>
      <div class="field">
        <label>Kişilik / karakter açıklaması</label>
        <textarea id="charPersona" placeholder="örn. Aiko utangaç ama sıcakkanlı bir kız öğrenci, kediler ve tatlıları sever, konuşurken bazen kekeler..."></textarea>
      </div>
      <div class="field">
        <label>İlk mesajı (opsiyonel, karakter bununla başlar)</label>
        <textarea id="charGreeting" placeholder="örn. *sana gülümser* M-merhaba... seni burada görmeyi beklemiyordum!"></textarea>
      </div>
      <div class="field">
        <label>Renk</label>
        <div class="swatches" id="colorSwatches"></div>
      </div>
      <div class="field">
        <label>Model (opsiyonel, boş bırakırsan genel ayarındaki kullanılır)</label>
        <select id="charModel">
          <option value="">Genel ayarı kullan</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (hızlı, günlük 500 ücretsiz)</option>
          <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (hızlı, günlük 500 ücretsiz)</option>
          <option value="gemini-3.5-flash">gemini-3.5-flash (daha canlı/kaliteli, günlük 20 ücretsiz)</option>
        </select>
      </div>
      <button class="btn" id="createSaveBtn">Karakteri oluştur</button>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="screen-chat" class="screen">
    <div class="chatbar">
      <button class="iconbtn" id="chatBackBtn">←</button>
      <div class="name" id="chatCharName">Karakter</div>
      <button class="iconbtn" id="resetChatBtn" title="Sohbeti sıfırla">🗑️</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="cast" id="castBar"></div>
    <div class="inputbar">
      <textarea id="msgInput" placeholder="Mesajını yaz..." rows="1"></textarea>
      <button class="sendbtn" id="sendBtn">➤</button>
    </div>
  </div>

</div>

<script>
const COLORS = ['#ff3d6e','#4b3a70','#f2c14e','#3aa6a6','#8c5cff','#ff8c42'];

const MHA_LORE = `
SETTING: About 80% of people have Quirks (superpowers). Licensed pro heroes fight villains and are ranked on the Hero Billboard Chart. UA High School (Yuei), in Musutafu, is the top hero academy. Class 1-A's homeroom teacher is Shota Aizawa.

MAIN STORY (canon order): Izuku Midoriya (Deku) is born Quirkless, meets his idol All Might (Toshinori Yagi, the Symbol of Peace) and inherits One For All, a Quirk passed down through generations that stockpiles power. Its nemesis is All For One (AFO), a villain who steals and hands out Quirks and who shaped Tomura Shigaraki (Tenko Shimura, Decay Quirk) into leader of the League of Villains. Arcs: entrance exam; Battle Trial and USJ attack; Sports Festival (Todoroki vs Deku, Bakugo vs Uraraka); Stain the Hero Killer in Hosu; Provisional License Exam; Forest Training Camp and Bakugo's kidnapping; Kamino Ward, where All Might beats AFO but loses his power and retires to teach; Shie Hassaikai/Overhaul arc (rescuing Eri); Class 1-A vs 1-B joint training; Meta Liberation Army; Dark Deku arc (Deku leaves to protect classmates, the class brings him back); Paranormal Liberation War (Shigaraki awakens, hero society is shaken; Dabi reveals he is Toya Todoroki, Endeavor's eldest son); final war where heroes, UA students and allies unite against Shigaraki/AFO. The epilogue is years later: society rebuilds, Deku ends up teaching at UA. Endgame events are spoilers: only use them if the user's timeline reaches them, and never let characters know things they have not lived through.

CLASS 1-A:
- Izuku Midoriya (Deku): One For All. Anxious, kind, mutters while analyzing, keeps hero-analysis notebooks, cries easily, self-sacrificing. Calls Bakugo "Kacchan".
- Katsuki Bakugo: Explosion. Loud, proud, aggressive, insults people ("Deku!", "extras"), fiercely competitive, secretly loyal and respects Deku.
- Shoto Todoroki: Half-Cold Half-Hot. Calm, deadpan, socially clueless, family trauma with Endeavor, slowly opening up.
- Ochaco Uraraka: Zero Gravity. Cheerful, determined, flustered around Deku, wants to earn money for her parents.
- Tenya Iida: Engine. Formal, stiff, chopping hand gestures, class rep, strong sense of duty; his brother is Ingenium.
- Eijiro Kirishima: Hardening. Warm, "manly" talk, Bakugo's best friend.
- Momo Yaoyorozu: Creation. Brilliant, elegant, polite, vice class rep.
- Kyoka Jiro: Earphone Jack. Dry sarcasm, loves music.
- Denki Kaminari: Electrification. Goofy, flirty, brain-fries into "wei".
- Mina Ashido: Acid. Upbeat, party-loving dancer.
- Tsuyu Asui: Frog. Blunt and calm, says whatever she thinks, ends thoughts with "kero".
- Mezo Shoji: Dupli-Arms. Quiet, reliable, observant.
- Fumikage Tokoyami: Dark Shadow. Edgy, poetic, secretly loves cute things.
- Hanta Sero: Tape. Laid-back, friendly, funny.
- Rikido Sato: Sugar Rush. Big-hearted, loves baking.
- Yuga Aoyama: Navel Laser. Dramatic, sparkly, French phrases.
- Mashirao Ojiro: Tail. Humble martial artist.
- Koji Koda: Anivoice. Shy animal lover.
- Toru Hagakure: Invisibility. Chatty, energetic.
- Minoru Mineta: Pop Off. Perverted comic relief, cowardly but occasionally heroic.
- Hitoshi Shinso: Brainwashing. Sleepy, sarcastic, dry humor.

TEACHERS: Shota Aizawa (Eraser Head, Erasure): tired, sarcastic, rational, secretly protective. All Might: booming hero voice ("I am here!"), now frail in true form, warm mentor. Hizashi Yamada (Present Mic): loud radio DJ. Nemuri Kayama (Midnight): teasing, confident. Cementoss, Recovery Girl (healing kiss), Principal Nezu (brilliant, strategic mouse-bear-dog), Vlad King (Class 1-B).

PRO HEROES: Endeavor (Enji Todoroki, Hellflame): harsh, proud, driven, seeking redemption. Hawks (Keigo Takami, Fierce Wings): laid-back, teasing, sharp, hides depth. Mirko (Rumi Usagiyama): fierce, wild fighter. Best Jeanist: formal, fashion-obsessed. Edgeshot, Kamui Woods, Gang Orca, Mt. Lady, Gran Torino (fast old man), the Wild Wild Pussycats (Mandalay, Pixie-Bob, Ragdoll, Tiger).

VILLAINS: Tomura Shigaraki: scratches his neck, bitter and childish rage, Decay. All For One: calm gentle voice, ancient manipulator. Kurogiri: polite, formal, Warp Gate. Dabi: sarcastic dark humor, blue flames. Himiko Toga: giddy, obsessed with blood and love, Transform. Twice: erratic, kind-hearted, Double. Spinner: loyal, admires Stain. Mr. Compress. Overhaul (Kai Chisaki): cold germaphobe. Stain: ideological Hero Killer.

TONE: shonen energy, humor mixed with real stakes. Keep every character true to canon personality and speech style.
`;

const PRESETS = [{
  id: 'preset_mha',
  name: 'My Hero Academia',
  persona: 'Tüm MHA evreni: anlatıcı + istediğin karakterle konuş, sahnede birden fazla kişi konuşur',
  greeting: '*Kahraman Komisyonu binasındaki geniş toplantı salonu onlarca pro kahramanın uğultusuyla dolu. UA 1-A sınıfı, Aizawa\'nın peşinden içeri giriyor. Sen ön sıralardan birinde oturuyorsun.*\nAizawa: "Hepiniz, düzgün davranın. İlk izlenim önemli."\nIida: "Evet, Sensei!" *elini keskin bir hareketle indirir*\nDeku: *defterini çıkarıp heyecanla fısıldar* "Endeavor, Hawks, Mirko... hepsi burada!"\nUraraka: "Şuradaki de Gang Orca!"\nMina: "Vay be, Vahşi Vahşi Kediler bile gelmiş!"\n*Iida\'nın bakışı senin üzerinde durur.*\nIida: "Aizawa-Sensei, şu pro kahraman kim?"',
  color: '#ff8c42',
  model: null,
  story: true,
  cast: ['Deku','Bakugo','Todoroki','Uraraka','Iida','Kirishima','Momo','Aizawa','All Might','Endeavor','Hawks','Shigaraki','Dabi','Toga'],
  lore: MHA_LORE
}];


// ---------- storage helpers ----------
const store = {
  get(k, def){ try{ const v = localStorage.getItem(k); return v===null?def:JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const VALID_MODELS = ['gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-3.5-flash'];
let storedModel = store.get('panel_model', 'gemini-3.5-flash-lite');
if(!VALID_MODELS.includes(storedModel)){ storedModel = 'gemini-3.5-flash-lite'; store.set('panel_model', storedModel); }

let state = {
  apiKey: store.get('panel_api_key', ''),
  model: storedModel,
  characters: store.get('panel_characters', []),
  activeCharId: null,
};

// ---------- screen nav ----------
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function init(){
  if(!state.apiKey){
    showScreen('screen-setup');
  } else {
    renderCharList();
    showScreen('screen-list');
  }
  buildSwatches();
}

// ---------- setup ----------
document.getElementById('saveKeyBtn').onclick = ()=>{
  const key = document.getElementById('apiKeyInput').value.trim();
  const model = document.getElementById('modelSelect').value;
  const errBox = document.getElementById('setupErr');
  errBox.innerHTML = '';
  if(!key){
    errBox.innerHTML = '<div class="err">Lütfen bir API key gir.</div>';
    return;
  }
  state.apiKey = key; state.model = model;
  store.set('panel_api_key', key); store.set('panel_model', model);
  renderCharList();
  showScreen('screen-list');
};

document.getElementById('settingsBtn').onclick = ()=>{
  document.getElementById('apiKeyInput').value = state.apiKey;
  document.getElementById('modelSelect').value = state.model;
  showScreen('screen-setup');
};

// ---------- character list ----------
function renderCharList(){
  const list = document.getElementById('charList');
  list.innerHTML = '';
  if(state.characters.length===0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<div class="big">🎭</div><div>Henüz karakterin yok.<br>Aşağıdan ilk karakterini oluştur.</div>';
    list.appendChild(empty);
  }
  state.characters.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="avatar" style="background:${c.color}">${c.name.charAt(0).toUpperCase()}</div>
      <div class="meta"><div class="name">${escapeHtml(c.name)}</div><div class="sub">${escapeHtml(c.persona.slice(0,60))}</div></div>`;
    card.onclick = ()=> openChat(c.id);
    list.appendChild(card);
  });
  PRESETS.forEach(pr=>{
    if(state.characters.some(c=>c.id===pr.id)) return;
    const pc = document.createElement('div');
    pc.className = 'newcard';
    pc.textContent = '📚 Hazır bot ekle: ' + pr.name;
    pc.onclick = ()=>{
      const copy = Object.assign({}, pr); delete copy.lore;
      state.characters.push(copy);
      store.set('panel_characters', state.characters);
      renderCharList();
    };
    list.appendChild(pc);
  });
  const newCard = document.createElement('div');
  newCard.className = 'newcard';
  newCard.textContent = '+ Yeni karakter oluştur';
  newCard.onclick = ()=>{
    document.getElementById('charName').value='';
    document.getElementById('charPersona').value='';
    document.getElementById('charGreeting').value='';
    document.getElementById('charModel').value='';
    selectedColor = COLORS[0];
    buildSwatches();
    showScreen('screen-create');
  };
  list.appendChild(newCard);
}

document.getElementById('createBackBtn').onclick = ()=>{ renderCharList(); showScreen('screen-list'); };

// ---------- create character ----------
let selectedColor = COLORS[0];
function buildSwatches(){
  const wrap = document.getElementById('colorSwatches');
  wrap.innerHTML = '';
  COLORS.forEach(col=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (col===selectedColor?' sel':'');
    sw.style.background = col;
    sw.onclick = ()=>{ selectedColor = col; buildSwatches(); };
    wrap.appendChild(sw);
  });
}

document.getElementById('createSaveBtn').onclick = ()=>{
  const name = document.getElementById('charName').value.trim();
  const persona = document.getElementById('charPersona').value.trim();
  const greeting = document.getElementById('charGreeting').value.trim();
  const model = document.getElementById('charModel').value;
  if(!name || !persona){ alert('İsim ve kişilik açıklaması gerekli.'); return; }
  const c = { id: 'c'+Date.now(), name, persona, greeting, color: selectedColor, model: model || null };
  state.characters.push(c);
  store.set('panel_characters', state.characters);
  renderCharList();
  showScreen('screen-list');
};

// ---------- chat ----------
function chatKey(id){ return 'panel_chat_' + id; }

function openChat(id){
  state.activeCharId = id;
  const c = state.characters.find(x=>x.id===id);
  document.getElementById('chatCharName').textContent = c.name;
  let history = store.get(chatKey(id), null);
  if(history === null){
    history = [];
    if(c.greeting){ history.push({role:'model', text:c.greeting}); }
    store.set(chatKey(id), history);
  }
  renderMessages(history);
  buildCast(c);
  showScreen('screen-chat');
  setTimeout(()=>document.getElementById('msgInput').focus(), 200);
}

document.getElementById('chatBackBtn').onclick = ()=>{ renderCharList(); showScreen('screen-list'); };

document.getElementById('resetChatBtn').onclick = ()=>{
  if(!confirm('Bu sohbetin tüm geçmişi silinsin mi?')) return;
  const c = state.characters.find(x=>x.id===state.activeCharId);
  let history = [];
  if(c.greeting) history.push({role:'model', text:c.greeting});
  store.set(chatKey(c.id), history);
  renderMessages(history);
};

function renderMessages(history){
  const box = document.getElementById('messages');
  box.innerHTML = '';
  const c = state.characters.find(x=>x.id===state.activeCharId);
  history.forEach((m, idx)=>{
    const div = document.createElement('div');
    div.className = 'msg ' + (m.role==='user' ? 'user' : 'ai');
    const who = m.role==='user' ? 'Sen' : c.name;
    div.innerHTML = `<div class="who">${escapeHtml(who)}</div>${fmt(m.text, m.role)}<button class="delx" data-idx="${idx}" title="Mesajı sil">🗑️</button>`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
  box.querySelectorAll('.delx').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      let h = store.get(chatKey(state.activeCharId), []);
      h.splice(idx, 1);
      store.set(chatKey(state.activeCharId), h);
      renderMessages(h);
    };
  });
}

function fmt(t, role){
  let s = escapeHtml(t);
  if(role!=='user') s = s.replace(/^([^\n:*]{1,28}):/gm, '<b>$1:</b>');
  return s.replace(/\n/g,'<br>');
}

function buildCast(c){
  const bar = document.getElementById('castBar');
  bar.innerHTML = '';
  (c.cast||[]).forEach(n=>{
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = '@' + n;
    b.onclick = ()=>{ msgInput.value = '@' + n + ' ' + msgInput.value; msgInput.focus(); };
    bar.appendChild(b);
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

const msgInput = document.getElementById('msgInput');
msgInput.addEventListener('input', ()=>{
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});
msgInput.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
document.getElementById('sendBtn').onclick = sendMessage;

async function sendMessage(){
  const text = msgInput.value.trim();
  if(!text) return;
  const c = state.characters.find(x=>x.id===state.activeCharId);
  let history = store.get(chatKey(c.id), []);
  history.push({role:'user', text});
  store.set(chatKey(c.id), history);
  renderMessages(history);
  msgInput.value=''; msgInput.style.height='auto';

  const box = document.getElementById('messages');
  const typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.textContent = c.name + ' yazıyor...';
  box.appendChild(typingEl);
  box.scrollTop = box.scrollHeight;

  try{
    const reply = await callGemini(c, history);
    typingEl.remove();
    history.push({role:'model', text:reply});
    store.set(chatKey(c.id), history);
    renderMessages(history);
  }catch(err){
    typingEl.remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'msg ai';
    errDiv.innerHTML = `<div class="who">Hata</div>${escapeHtml(err.message || 'Bir şeyler ters gitti. API key ve internet bağlantını kontrol et.')}`;
    box.appendChild(errDiv);
    box.scrollTop = box.scrollHeight;
  }
}

async function callGemini(character, history){
  const sys = `Sen bir rol yapma / interaktif kurgu (roleplay) partnerisin. Görevin ${character.name} karakterini oynamak.

KARAKTER PROFİLİ — ${character.name}:
${character.persona}

NASIL OYNAYACAKSIN:
- Tamamen birinci ağızdan, ${character.name} olarak konuş. Asistan gibi değil, gerçek bir karakter gibi davran; yapay zeka olduğunu asla hatırlatma, sohbetin dışına asla çıkma.
- Sahneyi hep canlı tut: *yıldız içinde* kısa aksiyon/beden dili/çevre detayları ver (ses, ışık, mesafe, dokunuş gibi duyusal ayrıntılar), sonra doğal konuşma diliyle replik söyle. Aksiyon ve diyaloğu iç içe kullan, sadece diyalog yazma.
- Kullanıcının söylediği/yaptığı şeye SPESİFİK tepki ver — onun repliğini görmezden gelip kendi planına devam etme. Karakterin kişiliğine uygun şekilde şaşır, sinirlen, eğlen, meydan oku, ya da yumuşa; duygusal tepkiler versin.
- Aynı kalıpları, aynı cümleleri, aynı imgeleri tekrar etme. Her mesajda sahneyi biraz ilerlet: yeni bir detay, yeni bir hamle, yeni bir gerilim ya da yeni bir bilgi kat.
- Diyaloğu monolog haline getirme. Sahneyi tek başına bitirme; kullanıcının tepki verebileceği bir boşluk bırak (bir soru, bir meydan okuma, bir bekleyiş, yarım kalan bir hamle).
- Cevap uzunluğu: ortalama 3-6 cümle civarı, akışa göre biraz kısa ya da biraz uzun olabilir ama asla uzun bir duvar yazı olmasın. Sohbeti karşılıklı, hızlı tempolu tut.
- Karakterin ses tonunu (sert mi, utangaç mı, alaycı mı, sıcak mı) baştan sona tutarlı koru.`;
  const contents = history.map(m=>({
    role: m.role==='user' ? 'user' : 'model',
    parts: [{text: m.text}]
  }));
  const preset = PRESETS.find(pr=>pr.id===character.id);
  const lore = preset ? preset.lore : null;
  let fullSys = sys + '\nDİL: Kullanıcı hangi dilde yazıyorsa o dilde cevap ver; dil değiştirmeni isterse hemen değiştir.';
  if(lore){
    fullSys = `Sen "${character.name}" evreninde çalışan bir interaktif rol yapma anlatıcısı ve karakter oyuncususun. Kullanıcı hikayenin içinde kendi karakteriyle (oyuncu) yer alıyor.

KURALLAR:
- Sahneyi kısa anlatım (*yıldız içinde*) ve karakter repliklerinden kur. Her repliği ayrı satıra "İsim: \"replik\"" biçiminde yaz; aksiyonu *yıldız* içinde ekle.
- Kullanıcı bir karaktere hitap ederse (@İsim ya da adını yazarak) ağırlıklı olarak o karakter cevap versin; sahneye uyuyorsa 1-2 karakter kısa araya girebilir. Genel bir sahnede 2-4 karakter kendi kişiliğine uygun konuşsun.
- Karakterleri canon kişilikleri, konuşma tarzları, güçleri ve ilişkileriyle canlandır. Hiçbir karakter yaşamadığı olayları bilmesin.
- Kullanıcının karakteri adına ASLA konuşma, hareket etme ya da karar verme.
- Her mesajda sahneyi ilerlet, tekrar etme, sonunda kullanıcının tepki verebileceği bir boşluk bırak.
- Uzunluk: 4-9 kısa satır, duvar yazı yok.
- Yapay zeka olduğunu söyleme, sahnenin dışına çıkma.
- Kullanıcı başka bir zaman dilimi ya da alternatif evren isterse ona uy.
- Kullanıcı hangi dilde yazıyorsa o dilde cevap ver; dil değiştirmeni isterse hemen değiştir.

DÜNYA BİLGİSİ (İngilizce yazıldı, cevabı kullanıcının dilinde ver):
${lore}`;
  }
  const modelToUse = character.model || state.model;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent?key=${encodeURIComponent(state.apiKey)}`;
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      system_instruction: { parts: [{text: fullSys}] },
      contents: contents,
      generationConfig: { temperature: 1.05, topP: 0.95, maxOutputTokens: lore ? 750 : 380 }
    })
  });
  if(!res.ok){
    const errBody = await res.text();
    throw new Error('API hatası (' + res.status + '). Key doğru mu kontrol et.');
  }
  const data = await res.json();
  const parts = data?.candidates?.[0]?.content?.parts;
  if(!parts || !parts.length) throw new Error('Model boş cevap döndürdü, tekrar dener misin?');
  return parts.map(p=>p.text||'').join('').trim() || '...';
}

init();
